<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SVG 도형 조작</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 120px;
      margin-top: 40px;
    }
    .shape-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>안녕! 나는 SVG 도형이야!</h1>

  <div class="container">
    <!-- 사각형 -->
    <div class="shape-box">
      <button disabled>⬜ Drag해서 크기 조절</button>
      <svg width="200" height="200">
        <rect id="box" x="50" y="60" width="80" height="80" fill="skyblue" onmousedown="startDrag(evt)" />
      </svg>
    </div>

    <!-- 원 -->
    <div class="shape-box">
      <button disabled>⚪ Drag해서 이동</button>
      <svg width="200" height="200">
        <circle id="circle" cx="100" cy="100" r="40" fill="pink" onmousedown="startDrag(evt)" />
      </svg>
    </div>

    <!-- 삼각형 -->
    <div class="shape-box">
      <button onclick="rotateTriangle()">🔺 Click해서 회전</button>
      <svg width="200" height="200">
        <polygon id="triangle" points="100,30 160,150 40,150" fill="lightgreen" />
      </svg>
    </div>
  </div>

  <script>
    let selected = null;
    let offset = { x: 0, y: 0 };
    let startSize = null;
    let triangleRotation = 0;

    function startDrag(evt) {
      selected = evt.target;

      if (selected.tagName === "rect") {
        offset.x = evt.clientX - parseFloat(selected.getAttribute("x"));
        offset.y = evt.clientY - parseFloat(selected.getAttribute("y"));
        startSize = {
          width: parseFloat(selected.getAttribute("width")),
          height: parseFloat(selected.getAttribute("height")),
          startX: evt.clientX,
          startY: evt.clientY
        };
      } else if (selected.tagName === "circle") {
        offset.x = evt.clientX - parseFloat(selected.getAttribute("cx"));
        offset.y = evt.clientY - parseFloat(selected.getAttribute("cy"));
      }

      window.addEventListener("mousemove", drag);
      window.addEventListener("mouseup", endDrag);
    }

    function drag(evt) {
      if (!selected) return;
      const newX = evt.clientX - offset.x;
      const newY = evt.clientY - offset.y;

      if (startSize && selected.tagName === "rect") {
        const dx = evt.clientX - startSize.startX;
        const dy = evt.clientY - startSize.startY;
        selected.setAttribute("width", Math.max(10, startSize.width + dx));
        selected.setAttribute("height", Math.max(10, startSize.height + dy));
      } else if (selected.tagName === "circle") {
        selected.setAttribute("cx", newX);
        selected.setAttribute("cy", newY);
      }
    }

    function endDrag() {
      window.removeEventListener("mousemove", drag);
      window.removeEventListener("mouseup", endDrag);
      selected = null;
      startSize = null;
    }

    function rotateTriangle() {
      const triangle = document.getElementById("triangle");
      triangleRotation = (triangleRotation + 90) % 360;
      triangle.setAttribute("transform", `rotate(${triangleRotation}, 100, 100)`);
    }
  </script>
</body>
</html>
